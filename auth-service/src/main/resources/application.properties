spring.application.name=auth-service

spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]
server.port=${AUTH_SERVICE_PORT:8083}
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:15432}/${AUTH_DB:auth_db}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
spring.jpa.open-in-view=false

# Both services must use the same private JWT key and claim settings.
helpdesk.jwt.ttl-seconds=${JWT_TTL_SECONDS:3600}
helpdesk.auth.allowed-origins=${AUTH_ALLOWED_ORIGINS:http://localhost:${TICKET_SERVICE_PORT:18081},http://127.0.0.1:${TICKET_SERVICE_PORT:18081}}
helpdesk.jwt.secret=${JWT_SECRET}
helpdesk.jwt.issuer=${JWT_ISSUER:enterprise-helpdesk-auth}
helpdesk.jwt.audience=${JWT_AUDIENCE:enterprise-helpdesk}
